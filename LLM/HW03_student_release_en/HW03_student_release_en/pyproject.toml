[project]
name = "qbc12-hw03-student"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.10.5",
    "numpy==2.3.2",
    "pandas==2.3.1",
    "psutil==7.0.0",
    "torch==2.7.1+cpu",
]

[dependency-groups]
dev = [
    "ipykernel==6.30.0",
    "jupyterlab==4.4.5",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
